    <!-- Light mode enforcement: strip dark theme from root -->
    <script>
      (function() {
        try {
          localStorage.removeItem('furnicraft_theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } catch (e) {}
      })();
    </script>
