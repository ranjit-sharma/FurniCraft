services:
  - type: web
    name: furnicraft
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        value: BN4aYgiIKCZLtbu3hJOGP-0zOmIssjVEGPAvtL0f0l2bvssi7vyprIQ74WE5TCZ-NWFKtabvZ1OBr5yEpzPFyus
      - key: VAPID_PRIVATE_KEY
        value: vsOE3nMehWXs7DcaBRuguR7bI6ww_bSZVVQQ94bl-kc
      - key: VAPID_SUBJECT
        value: mailto:furnicraft.erp@gmail.com
