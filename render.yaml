services:
  - type: web
    name: furnicraft
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: SMTP_USER
        value: furnicraft.erp@gmail.com
      - key: SMTP_PASS
        value: fdds krvn kkny riik
      - key: EMAIL_FROM
        value: '"FurniCraft ERP Security" <furnicraft.erp@gmail.com>'
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      - key: RESEND_API_KEY
        sync: false

